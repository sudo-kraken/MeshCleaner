name: Bug report
description: Report a reproducible MeshCleaner problem
labels: ['bug', 'awaiting triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For installation or usage help, use the support question form instead. Do not attach sensitive models or data.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and how it differs from what you expected.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MeshCleaner version
      description: Which release, tag or commit are you using?
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Paste the output of `python --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the operating system name, version and architecture.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Paste the command that produced the problem, with sensitive paths removed.
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Mesh format
      description: List the affected input format or formats, such as STL, OBJ or PLY.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, numbered sequence that consistently reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste verbose output with secrets and private paths removed.
      render: shell
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: Link to a non-sensitive mesh or describe the geometry needed to reproduce the problem.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/sudo-kraken/MeshCleaner/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
